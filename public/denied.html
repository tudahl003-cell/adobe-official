<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Photo Album</title>
  <style>
    body {
      margin: 0; padding: 0;
      background: #0e0e0e;
      min-height: 100vh; width: 100%; background-color: #0e0e0e;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .modal-overlay {
      position: fixed; top: 0; left: 0; height: 100%; width: 100%;
      background-color: rgba(0,0,0,0.6);
      display: flex; justify-content: center; align-items: center; z-index: 1000;
      padding: 15px; box-sizing: border-box;
    }
    .modal-content {
      background-color: #171717; border: 1px solid #2b2721;
      padding: 22px; border-radius: 10px;
      width: 100%; max-width: 460px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .rings { width: 48px; margin: 0 auto 12px auto; display: block; }
    h2 { font-size: 1.2rem; margin: 0 0 10px 0; color: #efe6d2; font-family: Georgia, "Times New Roman", serif; letter-spacing: 1px; }
    .modal-text { font-size: 0.95rem; line-height: 1.5; color: #b9b09c; margin-bottom: 10px; }
    .modal-subtext { font-size: 0.85rem; line-height: 1.5; color: #8d867a; padding-top: 10px; margin: 0; }
  </style>
</head>
<body>
  <div id="confirmationModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <svg class="rings" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="38" cy="54" r="26" fill="none" stroke="#c9a86a" stroke-width="7"/>
          <circle cx="62" cy="46" r="26" fill="none" stroke="#a8894e" stroke-width="7"/>
        </svg>
        <h2>Aria &amp; James &mdash; Our Wedding</h2>
      </div>
      <p class="modal-text">The album is designed to be viewed on a computer, so it can't be opened on this device.</p>
      <p class="modal-subtext">Please open it on a laptop or desktop to see the photos.</p>
    </div>
  </div>
</body>
</html>
