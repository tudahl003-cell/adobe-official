<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RMM Dashboard</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:24px; }
  h2 { font-size:15px; margin:0 0 12px; color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  input,button,select { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#0b1220; color:var(--txt); }
  button { background:var(--accent); color:#04222f; border:none; cursor:pointer; font-weight:600; }
  button.secondary { background:#334155; color:var(--txt); }
  button.danger { background:transparent; color:var(--bad); border:1px solid var(--bad); font-weight:600; }
  button.danger:hover { background:rgba(239,68,68,.12); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .pill { padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .online { background:rgba(34,197,94,.15); color:var(--ok); }
  .offline { background:rgba(148,163,184,.15); color:var(--muted); }
  .removing { background:rgba(245,158,11,.15); color:var(--warn); }
  button.linkish { background:transparent; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:11px; padding:2px 4px; }
  button.linkish:hover { color:var(--txt); }
  .st-pending,.st-dispatched { color:var(--warn); }
  .st-success { color:var(--ok); }
  .st-failed { color:var(--bad); }
  .muted { color:var(--muted); font-size:12px; }
  code { background:#0b1220; padding:1px 5px; border-radius:5px; }
</style>
</head>
<body>
<header>
  <h1>🖥️ RMM Dashboard</h1>
  <div class="row" style="margin-left:auto">
    <input id="adminKey" type="password" placeholder="Admin key" style="width:280px" />
    <button onclick="saveKey()">Connect</button>
    <span id="status" class="muted"></span>
  </div>
</header>
<main>
  <div class="card">
    <h2>1 · Upload an installer</h2>
    <div class="row">
      <input id="file" type="file" accept=".exe,.msi" />
      <button onclick="upload()">Upload</button>
      <span id="uploadInfo" class="muted"></span>
    </div>
    <p class="muted">Uploaded file is stored on the server and can then be deployed to any enrolled PC.</p>
  </div>

  <div class="card">
    <h2>2 · Enrolled computers</h2>
    <table>
      <thead><tr><th>Hostname</th><th>OS</th><th>Status</th><th>Last seen</th><th>Deploy</th><th></th></tr></thead>
      <tbody id="agents"><tr><td colspan="6" class="muted">Connect with your admin key…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>3 · Deployment jobs</h2>
    <table>
      <thead><tr><th>Computer</th><th>Installer</th><th>Args</th><th>Status</th><th>Exit</th><th>When</th></tr></thead>
      <tbody id="jobs"><tr><td colspan="6" class="muted">—</td></tr></tbody>
    </table>
  </div>
</main>

<script>
let adminKey = sessionStorage.getItem("rmmAdminKey") || "";
let lastUpload = null;       // { fileName, originalName }
let agentsCache = [];

document.getElementById("adminKey").value = adminKey;

function saveKey() {
  adminKey = document.getElementById("adminKey").value.trim();
  sessionStorage.setItem("rmmAdminKey", adminKey);
  refresh();
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({ "X-Admin-Key": adminKey }, opts.headers || {});
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({error:r.statusText}))).error || r.statusText);
  return r.json();
}

function isOnline(lastSeen) {
  return (Date.now() - new Date(lastSeen).getTime()) < 90_000; // 90s
}
function fmt(t) { return t ? new Date(t).toLocaleString() : "—"; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function upload() {
  const f = document.getElementById("file").files[0];
  if (!f) { alert("Pick a file first"); return; }
  const info = document.getElementById("uploadInfo");
  info.textContent = "Uploading " + f.name + "…";
  try {
    const res = await api("/api/upload?fileName=" + encodeURIComponent(f.name), { method:"POST", body:f });
    lastUpload = res;
    info.textContent = "Ready to deploy: " + res.originalName;
    renderAgents();
  } catch (e) { info.textContent = "Error: " + e.message; }
}

async function deploy(agentId) {
  if (!lastUpload) { alert("Upload an installer first"); return; }
  const args = prompt("Silent-install arguments (optional, e.g. /S or /quiet /norestart):", "/S") || "";
  try {
    await api("/api/deploy", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ agentId, fileName:lastUpload.fileName, originalName:lastUpload.originalName, arguments:args })
    });
    refresh();
  } catch (e) { alert("Deploy failed: " + e.message); }
}

// Graceful remove: tell the PC to uninstall the agent itself on its next check-in.
async function removeAgent(agentId, hostname) {
  if (!confirm(`Remove "${hostname}"?\n\nThe RMM agent will uninstall itself from that PC on its next check-in (~30s), then disappear here. The PC must be online for this to complete.`)) return;
  try {
    await api("/api/agents/" + encodeURIComponent(agentId) + "/remove", { method: "POST" });
    refresh();
  } catch (e) { alert("Remove failed: " + e.message); }
}

// Force remove: just drop the record now (for offline / decommissioned / legacy PCs).
async function forceRemoveAgent(agentId, hostname) {
  if (!confirm(`Force-remove "${hostname}" from the dashboard now?\n\nThis only deletes the record. If the agent is still installed and running, it will re-enroll and reappear. Use this for PCs that are gone or already uninstalled.`)) return;
  try {
    await api("/api/agents/" + encodeURIComponent(agentId), { method: "DELETE" });
    refresh();
  } catch (e) { alert("Force remove failed: " + e.message); }
}

function renderAgents() {
  const tb = document.getElementById("agents");
  if (!agentsCache.length) { tb.innerHTML = '<tr><td colspan="6" class="muted">No computers enrolled yet.</td></tr>'; return; }
  tb.innerHTML = agentsCache.map(a => {
    const on = isOnline(a.lastSeen);
    const statusPill = a.removing
      ? '<span class="pill removing">removing…</span>'
      : `<span class="pill ${on?'online':'offline'}">${on?'online':'offline'}</span>`;
    return `<tr>
      <td>${esc(a.hostname)}<div class="muted">${esc(a.agentId)}</div></td>
      <td>${esc(a.os)}</td>
      <td>${statusPill}</td>
      <td>${fmt(a.lastSeen)}</td>
      <td><button ${lastUpload?'':'disabled'} onclick="deploy('${a.agentId}')">Install ${lastUpload?esc(lastUpload.originalName):'(upload first)'}</button></td>
      <td>
        <button class="danger" onclick="removeAgent('${a.agentId}','${esc(a.hostname)}')">Remove</button>
        <button class="linkish" onclick="forceRemoveAgent('${a.agentId}','${esc(a.hostname)}')" title="Just delete the record (for offline/decommissioned PCs)">force</button>
      </td>
    </tr>`;
  }).join("");
}

function renderJobs(jobs) {
  const tb = document.getElementById("jobs");
  if (!jobs.length) { tb.innerHTML = '<tr><td colspan="6" class="muted">No jobs yet.</td></tr>'; return; }
  const byId = Object.fromEntries(agentsCache.map(a=>[a.agentId,a.hostname]));
  tb.innerHTML = jobs.slice().reverse().map(j => `<tr>
      <td>${esc(byId[j.agentId]||j.agentId)}</td>
      <td>${esc(j.originalName||j.fileName)}</td>
      <td><code>${esc(j.arguments||'')}</code></td>
      <td class="st-${esc(j.status)}">${esc(j.status)}</td>
      <td>${j.exitCode==null?'—':esc(j.exitCode)}</td>
      <td>${fmt(j.finishedAt||j.createdAt)}</td>
    </tr>`).join("");
}

async function refresh() {
  const st = document.getElementById("status");
  if (!adminKey) { st.textContent = "enter admin key"; return; }
  try {
    // PowerShell's ConvertTo-Json emits a single item as an object, not an array.
    const toArr = x => Array.isArray(x) ? x : (x ? [x] : []);
    const a = await api("/api/agents"); agentsCache = toArr(a.agents);
    const j = await api("/api/jobs");
    renderAgents(); renderJobs(toArr(j.jobs));
    st.textContent = "connected";
  } catch (e) { st.textContent = "auth error: " + e.message; }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
